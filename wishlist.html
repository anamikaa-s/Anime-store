<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | Anime Store</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .navbar {
            background: linear-gradient(to right,
                    rgb(40, 0, 0),
                    rgb(90, 2, 2),
                    rgb(90, 2, 2));
        }
        /* ============================= */
/* RESPONSIVE NAVBAR */
/* ============================= */

@media (max-width: 1100px) {

    .navbar {
        height: auto;
        min-height: 110px;
        flex-wrap: wrap;
        padding: 10px 15px;
    }

    /* LOGO */

    .navbar > div:first-child {
        width: 150px;
    }

    .navbar > div:first-child img {
        width: 150px;
        height: 100px;
    }

    /* ANIME STORE */

    .navbar > div:nth-child(2) {
        margin-left: 5px;
    }

    .navbar > div:nth-child(2) h1 {
        font-size: 28px;
    }

    /* MENU */

    .navbar > div:nth-child(3) {
        order: 5;
        width: 100%;
        justify-content: center;
        margin: 8px 0 0 0;
        flex-wrap: wrap;
    }

    .navbar > div:nth-child(3) a {
        font-size: 16px;
        margin-left: 10px;
        margin-right: 10px;
    }

    /* SEARCH */

    .navbar > div:nth-child(4) {
        margin-left: auto;
    }

    .navbar > div:nth-child(4) input {
        width: 120px;
    }

    /* ICONS */

    .navbar > div:nth-child(5) {
        margin-right: 5px;
    }
}


/* ============================= */
/* TABLET */
/* ============================= */

@media (max-width: 800px) {

    .navbar {
        min-height: 105px;
        padding: 8px 10px;
    }

    /* LOGO */

    .navbar > div:first-child {
        width: 120px;
    }

    .navbar > div:first-child img {
        width: 120px;
        height: 90px;
        margin-left: -10px;
    }

    /* ANIME STORE */

    .navbar > div:nth-child(2) h1 {
        font-size: 24px;
    }

    .navbar > div:nth-child(2) p {
        font-size: 9px;
    }

    /* SEARCH */

    .navbar > div:nth-child(4) input {
        width: 90px;
    }

    /* MENU */

    .navbar > div:nth-child(3) a {
        font-size: 14px;
        margin-left: 7px;
        margin-right: 7px;
    }

    /* ICONS */

    .navbar > div:nth-child(5) {
        margin-left: 5px;
    }

    .navbar > div:nth-child(5) a {
        font-size: 18px;
        margin-left: 5px;
        margin-right: 5px;
    }
}


/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width: 600px) {

    .navbar {
        min-height: 100px;
        padding: 8px 10px;
    }

    /* LOGO */

    .navbar > div:first-child {
        width: 90px;
    }

    .navbar > div:first-child img {
        width: 90px;
        height: 75px;
        margin-left: -8px;
    }

    /* ANIME STORE */

    .navbar > div:nth-child(2) {
        margin-left: 0;
    }

    .navbar > div:nth-child(2) h1 {
        font-size: 20px;
    }

    .navbar > div:nth-child(2) p {
        font-size: 8px;
    }

    /* SEARCH */

    .navbar > div:nth-child(4) {
        margin-left: auto;
        height: 35px;
        padding: 0 8px;
    }

    .navbar > div:nth-child(4) input {
        width: 70px;
        font-size: 12px;
    }

    /* ICONS */

    .navbar > div:nth-child(5) {
        margin-left: 3px;
        margin-right: 0;
    }

    .navbar > div:nth-child(5) a {
        font-size: 16px;
        margin-left: 3px;
        margin-right: 3px;
    }

    /* MENU */

    .navbar > div:nth-child(3) {
        gap: 3px;
        margin-top: 5px;
    }

    .navbar > div:nth-child(3) a {
        font-size: 13px;
        margin-left: 5px;
        margin-right: 5px;
    }

    /* CONTENT */

    section.pt-32 {
        padding-top: 120px;
    }

}


/* ============================= */
/* VERY SMALL MOBILE */
/* ============================= */

@media (max-width: 400px) {

    .navbar {
        padding: 6px;
    }

    /* HIDE BIG LOGO */

    .navbar > div:first-child {
        width: 65px;
    }

    .navbar > div:first-child img {
        width: 70px;
        height: 65px;
        margin-left: -10px;
    }

    /* STORE TEXT */

    .navbar > div:nth-child(2) h1 {
        font-size: 17px;
    }

    .navbar > div:nth-child(2) p {
        font-size: 7px;
    }

    /* SEARCH */

    .navbar > div:nth-child(4) {
        height: 32px;
        padding: 0 5px;
    }

    .navbar > div:nth-child(4) input {
        width: 55px;
        font-size: 11px;
    }

    .navbar > div:nth-child(4) i {
        font-size: 12px;
    }

    /* ICONS */

    .navbar > div:nth-child(5) a {
        font-size: 14px;
        margin-left: 2px;
        margin-right: 2px;
    }

    /* MENU */

    .navbar > div:nth-child(3) a {
        font-size: 12px;
        margin-left: 3px;
        margin-right: 3px;
    }

    /* WISHLIST CONTENT */

    section.pt-32 {
        padding-top: 115px;
    }

}
    </style>
</head>


<body class="bg-white">


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <div class="flex navbar fixed top-0 left-0 w-full h-32 items-center z-40">


        <!-- BIG LOGO - LEFT -->

        <div class="w-48 flex-shrink-0 m-0 p-0">

            <img src="anime logo.png"
                alt="Ronin Hunter"
                class="w-48 h-32 object-contain -ml-6">

        </div>



        <!-- ANIME STORE -->

        <div class="ml-5 mr-2 whitespace-nowrap leading-none">

    <h1 class="text-4xl font-black tracking-wider text-white">
        ANIME
    </h1>

    <p class="text-xs tracking-[0.35em] text-red-700 font-semibold ml-1">
        STORE
    </p>

</div>



        <!-- MENU -->

        <div class="flex items-center ml-14 whitespace-nowrap">


            <a href="index.html"
                class="text-stone-200 mx-4 text-xl font-semibold hover:text-red-400">

               Home

            </a>


            <a href=""
                class="text-stone-200 mx-4 text-xl font-semibold hover:text-red-400">

                naruto

            </a>


            <a href=""
                class="text-stone-200 mx-4 text-xl font-semibold hover:text-red-400">

                shop

            </a>


            <a href=""
                class="text-stone-200 mx-4 text-xl font-semibold hover:text-red-400">

                Shop by Anime

            </a>


        </div>



        <!-- ================================================= -->
        <!-- SEARCH -->
        <!-- ================================================= -->

        <div class="ml-auto text-stone-200 border-2 border-stone-200 rounded-xl
                    h-10 px-3 flex items-center">


            <input type="text"
                placeholder="search..."
                class="placeholder:text-stone-200 font-semibold
                       outline-none bg-transparent w-44">


            <i class="fa fa-search ml-2"></i>


        </div>



        <!-- ================================================= -->
        <!-- ICONS -->
        <!-- ================================================= -->

        <div class="flex items-center ml-4 mr-6">


            <!-- WISHLIST -->

            <a href="wishlist.html"
                class="text-stone-200 mx-2 text-xl hover:text-red-400">

                <i class="fa fa-heart-o"></i>

            </a>



            <!-- CART -->

            <a href="cart.html"
                class="text-stone-200 mx-2 text-xl hover:text-red-400">

                <i class="fa fa-shopping-cart"></i>

            </a>



            <!-- USER -->

            <a href="login.html"
                class="text-stone-200 mx-2 text-xl hover:text-red-400">

                <i class="fa fa-user"></i>

            </a>


        </div>

    </div>
<!-- PAGE -->

    <section class="pt-32 min-h-screen border-b border-gray-200">


        <div class="max-w-6xl mx-auto text-center pt-12">


            <!-- BREADCRUMB -->

            <div class="text-sm mb-3">

                <span class="text-gray-400">
                    Home
                </span>

                <span class="text-gray-400 mx-2">
                    •
                </span>

                <span class="text-gray-800">
                    Wishlist
                </span>

            </div>



            <!-- TITLE -->

            <h1 class="text-3xl font-bold text-black">

                Wishlist

            </h1>


<!-- WISHLIST -->

            <div class="mt-20">


                <p class="text-gray-700 text-base">

                    No products were added to the shop page.

                </p>



                <!-- BACK TO SHOPPING BUTTON -->

                <a href="index.html"
                    class="inline-flex items-center justify-center
                           mt-9
                           bg-black text-white
                           font-semibold
                           rounded-full
                           px-10 py-4
                           hover:bg-gray-800
                           transition">

                    Back to Shopping

                </a>


            </div>


        </div>


    </section>


</body>

</html>
