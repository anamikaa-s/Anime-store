<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suggest a Collection</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>

    /* NAVBAR */

    .navbar {
        width: 100%;
    }


    /* TABLET */

    @media (max-width: 900px) {

        .navbar {
            height: auto;
            min-height: 80px;
            padding: 15px 20px;
        }

        .logo-text {
            font-size: 18px;
        }

        .nav-links a {
            margin-left: 10px;
            margin-right: 10px;
        }

    }


    /* MOBILE */

    @media (max-width: 600px) {

        .navbar {
            min-height: 70px;
            padding: 12px 15px;
        }

        .navbar i {
            font-size: 24px;
        }

        .logo-text {
            font-size: 16px;
        }

        .nav-links a {
            font-size: 14px;
            margin-left: 6px;
            margin-right: 6px;
        }

    }


    /* SMALL MOBILE */

    @media (max-width: 400px) {

        .navbar {
            padding: 10px;
        }

        .navbar i {
            font-size: 21px;
        }

        .logo-text {
            font-size: 14px;
        }

        .nav-links a {
            font-size: 13px;
            margin-left: 4px;
            margin-right: 4px;
        }

    }

</style>

</head>

<body class="bg-neutral-950 text-white">

  <!-- Navbar -->

<nav class="navbar bg-gradient-to-r from-neutral-950 via-red-950 to-neutral-950
            h-24 flex items-center px-8">

    <!-- Logo -->

    <div class="flex items-center gap-3">

        <i class="fa fa-superpowers text-rose-700 text-3xl"></i>

        <span class="logo-text text-xl font-bold tracking-wide">
            ANIME STORE
        </span>

    </div>


    <!-- Navigation -->

    <div class="nav-links ml-auto flex items-center">

        <a href="index.html"
            class="mx-4 text-stone-200 font-semibold hover:text-rose-700">
            Home
        </a>

    </div>

</nav>


    <!-- Main Section -->
    <section class="min-h-[calc(100vh-96px)] flex items-center justify-center px-5 py-16">

        <div class="w-full max-w-3xl">

            <!-- Heading -->
            <div class="text-center mb-10">

                <i class="fa fa-superpowers text-rose-700 text-4xl"></i>

                <p class="text-rose-700 text-sm font-bold tracking-[0.2em] mt-5">
                    CAN'T FIND WHAT YOU LOVE?
                </p>

                <h1 class="text-4xl md:text-5xl font-black mt-3">
                    SUGGEST A COLLECTION
                </h1>

                <p class="text-stone-400 mt-4">
                    Tell us what you'd like to see in our store.
                    Your suggestion could become our next collection!
                </p>

            </div>


            <!-- Form Card -->
            <div class="bg-white rounded-2xl p-7 md:p-10 text-neutral-900 shadow-xl">

                <form>

                    <!-- Name + Email -->
                    <div class="grid md:grid-cols-2 gap-5">

                        <div>
                            <label class="block font-semibold mb-2">
                                Your Name
                            </label>

                            <input type="text"
                                placeholder="Enter your name"
                                class="w-full border border-stone-300 rounded-lg px-4 py-3
                                       outline-none focus:border-orange-500">
                        </div>


                        <div>
                            <label class="block font-semibold mb-2">
                                Email Address
                            </label>

                            <input type="email"
                                placeholder="Enter your email"
                                class="w-full border border-stone-300 rounded-lg px-4 py-3
                                       outline-none focus:border-orange-500">
                        </div>

                    </div>


                    <!-- Anime Name -->
                    <div class="mt-5">

                        <label class="block font-semibold mb-2">
                            Anime / Series Name
                        </label>

                        <input type="text"
                            placeholder="Example: One Piece"
                            class="w-full border border-stone-300 rounded-lg px-4 py-3
                                   outline-none focus:border-orange-500">

                    </div>


                    <!-- Category -->
                    <div class="mt-5">

                        <label class="block font-semibold mb-2">
                            What would you like?
                        </label>

                        <select
                            class="w-full border border-stone-300 rounded-lg px-4 py-3
                                   bg-white outline-none focus:border-orange-500">

                            <option value="">
                                Select a category
                            </option>

                            <option>
                                Figures
                            </option>

                            <option>
                                Keychains
                            </option>

                            <option>
                                Katanas & Swords
                            </option>

                            <option>
                                Head Gears
                            </option>

                            <option>
                                Lamps & Lights
                            </option>

                            <option>
                                Wall Art & Decor
                            </option>

                            <option>
                                Cosplay Apparel
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Suggestion -->
                    <div class="mt-5">

                        <label class="block font-semibold mb-2">
                            Tell us more
                        </label>

                        <textarea
                            rows="5"
                            placeholder="Tell us what anime merchandise you'd like to see..."
                            class="w-full border border-stone-300 rounded-lg px-4 py-3
                                   outline-none resize-none focus:border-orange-500"></textarea>

                    </div>


                    <!-- Submit -->
                    <div class="text-center mt-7">

                        <button type="submit"
                            class="bg-red-700 hover:bg-rose-700
                                   text-neutral-950 font-bold px-8 py-3
                                   rounded-lg transition duration-300">

                            <i class="fa fa-paper-plane mr-2"></i>
                            SUBMIT SUGGESTION

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-black text-center py-6 text-stone-500 text-sm">

        © 2026 Anime Store. All rights reserved.

    </footer>

</body>

</html>
