<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="min-h-screen bg-stone-950 text-white flex items-center justify-center">

    <div class="text-center">

        <!-- Cart icon -->
        <i class="fa fa-shopping-cart text-6xl text-stone-400"></i>

        <!-- Heading -->
        <h1 class="text-4xl font-bold mt-6">
            Your Cart Is Empty
        </h1>

        <!-- Description -->
        <p class="text-stone-400 mt-3">
            You haven't added anything to your cart yet.
        </p>

        <!-- Continue Shopping -->
        <a href="index.html"
            class="inline-block mt-7 bg-white text-black
                   px-8 py-3 rounded-full font-semibold
                   hover:bg-stone-300">

            Continue Shopping

        </a>

    </div>

</body>

</html>
